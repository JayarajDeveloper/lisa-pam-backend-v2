services:
  postgres:
    image: postgres:16-alpine
    container_name: lisa-pam-v2-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: lisa
      POSTGRES_PASSWORD: lisa
      POSTGRES_DB: lisa_pam_v2
    volumes:
      - lisa_pam_v2_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa -d lisa_pam_v2"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  lisa_pam_v2_pg:
